services:
  backend:
    build:
      context: ./backend
    container_name: ton-miner-backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-development-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:9000,http://127.0.0.1:9000}
      DATABASE_PATH: /data/db.sqlite3
    ports:
      - "10000:10000"
    volumes:
      - ton_miner_db:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ton-miner-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:10000/api
    ports:
      - "9000:9000"
    restart: unless-stopped

volumes:
  ton_miner_db:
