services:
  backend:
    build:
      context: ./backend
    container_name: ton-miner-backend
    env_file:
      - ./backend/.env.example
    environment:
      DB_NAME: /data/db.sqlite3
    ports:
      - "${BACKEND_PORT:-10000}:8000"
    volumes:
      - django_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: ton-miner-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-9000}:80"
    restart: unless-stopped

volumes:
  django_data: